<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fEvac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="fRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1400" height="920" fill="#fbfaf7"/>
  <text x="700" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Planta tipo de un teatro a la italiana</text>
  <text x="700" y="62" text-anchor="middle" font-size="14" fill="#666">Esquema didáctico — vocabulario de los temas 30-32 y 41 (no corresponde a ningún edificio real)</text>

  <!-- Envolvente del edificio -->
  <rect x="60" y="95" width="1280" height="700" fill="#ffffff" stroke="#333" stroke-width="3"/>

  <!-- ============ SALA (izquierda) ============ -->
  <!-- Vestíbulo -->
  <rect x="60" y="95" width="120" height="700" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="440" text-anchor="middle" font-size="15" fill="#334" transform="rotate(-90 120 440)">VESTÍBULO · TAQUILLAS · ACCESO DEL PÚBLICO</text>

  <!-- Fondo de sala: cabinas -->
  <rect x="180" y="95" width="70" height="700" fill="#f7f4ee" stroke="#333" stroke-width="1"/>
  <rect x="188" y="330" width="54" height="100" fill="#ddd6c8" stroke="#555"/>
  <text x="215" y="385" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90 215 385)">CABINA LUZ</text>
  <rect x="188" y="470" width="54" height="100" fill="#ddd6c8" stroke="#555"/>
  <text x="215" y="525" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90 215 525)">CABINA SONIDO</text>
  <text x="215" y="180" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90 215 180)">FONDO DE SALA</text>

  <!-- Platea en herradura: arcos de butacas -->
  <g stroke="#8a93a6" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M 330 205 A 250 250 0 0 0 330 715"/>
    <path d="M 375 240 A 210 210 0 0 0 375 680"/>
    <path d="M 420 275 A 170 170 0 0 0 420 645"/>
    <path d="M 465 310 A 130 130 0 0 0 465 610"/>
    <path d="M 510 345 A 95 95 0 0 0 510 575"/>
  </g>
  <text x="430" y="466" text-anchor="middle" font-size="17" font-weight="bold" fill="#334">PLATEA</text>
  <text x="430" y="486" text-anchor="middle" font-size="12" fill="#556">(herradura)</text>

  <!-- Pasillo de herradura -->
  <path d="M 300 180 A 285 285 0 0 0 300 740" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="270" y="705" font-size="11" fill="#8a6d00">pasillo de</text>
  <text x="270" y="719" font-size="11" fill="#8a6d00">herradura</text>

  <!-- Puertas laterales de platea -->
  <rect x="296" y="168" width="42" height="14" fill="#1a7f37"/>
  <text x="345" y="160" font-size="11" fill="#1a7f37">puerta lateral de platea</text>
  <rect x="296" y="738" width="42" height="14" fill="#1a7f37"/>
  <text x="345" y="770" font-size="11" fill="#1a7f37">puerta lateral de platea</text>

  <!-- Palcos de proscenio -->
  <rect x="618" y="120" width="70" height="70" fill="#e8dfce" stroke="#333"/>
  <text x="653" y="150" text-anchor="middle" font-size="10" fill="#333">PALCO DE</text>
  <text x="653" y="163" text-anchor="middle" font-size="10" fill="#333">PROSCENIO</text>
  <rect x="618" y="730" width="70" height="70" fill="#e8dfce" stroke="#333"/>
  <text x="653" y="760" text-anchor="middle" font-size="10" fill="#333">PALCO DE</text>
  <text x="653" y="773" text-anchor="middle" font-size="10" fill="#333">PROSCENIO</text>

  <!-- Foso de orquesta -->
  <rect x="620" y="300" width="60" height="320" fill="#cdd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#234" transform="rotate(-90 650 462)">FOSO DE ORQUESTA</text>
  <text x="668" y="462" text-anchor="middle" font-size="10" fill="#456" transform="rotate(-90 668 462)">(elevadores de foso · finales de carrera)</text>

  <!-- Corbata / proscenio -->
  <rect x="680" y="300" width="34" height="320" fill="#efe9db" stroke="#333" stroke-width="1"/>
  <text x="697" y="462" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90 697 462)">CORBATA · PROSCENIO</text>

  <!-- ============ TELÓN CORTAFUEGOS / BOCA ============ -->
  <line x1="714" y1="270" x2="714" y2="650" stroke="#c62828" stroke-width="8" stroke-dasharray="18 10"/>
  <text x="714" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">TELÓN CORTAFUEGOS</text>
  <text x="714" y="672" text-anchor="middle" font-size="12" fill="#c62828">BOCA / EMBOCADURA</text>

  <!-- ============ CAJA ESCÉNICA (derecha) ============ -->
  <rect x="714" y="150" width="420" height="620" fill="#fdf6ec" stroke="#333" stroke-width="2"/>
  <text x="924" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">CAJA ESCÉNICA</text>

  <!-- Hombros -->
  <rect x="714" y="150" width="420" height="90" fill="#f3e8d2" stroke="#333" stroke-width="1"/>
  <text x="924" y="203" text-anchor="middle" font-size="14" fill="#5a4a1a">HOMBRO (lado Zorrilla*)</text>
  <rect x="714" y="680" width="420" height="90" fill="#f3e8d2" stroke="#333" stroke-width="1"/>
  <text x="924" y="733" text-anchor="middle" font-size="14" fill="#5a4a1a">HOMBRO (lado Madrazo*)</text>
  <text x="924" y="753" text-anchor="middle" font-size="10" fill="#8a7a4a">*toponimia del Teatro de la Zarzuela usada en el supuesto de 2022</text>

  <!-- Escenario -->
  <rect x="714" y="240" width="330" height="440" fill="#fbefdb" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="879" y="450" text-anchor="middle" font-size="20" font-weight="bold" fill="#6b4e00">ESCENARIO</text>
  <!-- Varas -->
  <g stroke="#b09a5c" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="740" y1="290" x2="1020" y2="290"/>
    <line x1="740" y1="330" x2="1020" y2="330"/>
    <line x1="740" y1="370" x2="1020" y2="370"/>
  </g>
  <text x="1030" y="334" font-size="10" fill="#8a7a3a">varas</text>
  <!-- Escotillón -->
  <rect x="820" y="540" width="80" height="55" fill="none" stroke="#8a6d1a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="860" y="612" text-anchor="middle" font-size="10" fill="#8a6d1a">escotillón / trampilla (foso escénico bajo escenario)</text>
  <!-- Nota peine -->
  <rect x="732" y="398" width="292" height="38" fill="#fff8e6" stroke="#c9a227" stroke-width="1"/>
  <text x="879" y="414" text-anchor="middle" font-size="11" fill="#7a5c00">PEINE y TELAR: sobre la caja, a +18–25 m</text>
  <text x="879" y="428" text-anchor="middle" font-size="10" fill="#9a7c20">(sustentación: contrapesado manual o motorizado)</text>

  <!-- Chácena -->
  <rect x="1044" y="240" width="90" height="440" fill="#efe3c8" stroke="#333" stroke-width="1"/>
  <text x="1089" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4a1a" transform="rotate(-90 1089 450)">CHÁCENA (foro)</text>

  <!-- Zona posterior: camerinos, drapería, muelle -->
  <rect x="1134" y="95" width="206" height="700" fill="#eef2ee" stroke="#333" stroke-width="1.5"/>
  <rect x="1150" y="120" width="174" height="180" fill="#e0e8e0" stroke="#555"/>
  <text x="1237" y="200" text-anchor="middle" font-size="12" fill="#2a3a2a">CAMERINOS</text>
  <text x="1237" y="216" text-anchor="middle" font-size="10" fill="#4a5a4a">(individuales y colectivos)</text>
  <rect x="1150" y="330" width="174" height="120" fill="#e0e8e0" stroke="#555"/>
  <text x="1237" y="382" text-anchor="middle" font-size="12" fill="#2a3a2a">CUARTO DE</text>
  <text x="1237" y="397" text-anchor="middle" font-size="12" fill="#2a3a2a">DRAPERÍA</text>
  <rect x="1150" y="480" width="174" height="110" fill="#e0e8e0" stroke="#555"/>
  <text x="1237" y="528" text-anchor="middle" font-size="12" fill="#2a3a2a">SASTRERÍA ·</text>
  <text x="1237" y="543" text-anchor="middle" font-size="12" fill="#2a3a2a">CARACTERIZACIÓN</text>
  <rect x="1150" y="620" width="174" height="150" fill="#dcd4c4" stroke="#555"/>
  <text x="1237" y="688" text-anchor="middle" font-size="12" fill="#3a3a2a">MUELLE DE CARGA</text>
  <text x="1237" y="704" text-anchor="middle" font-size="10" fill="#5a5a4a">(descarga de escenografía)</text>

  <!-- ============ EVACUACIÓN ============ -->
  <!-- AE1: vestíbulo -->
  <circle cx="60" cy="445" r="24" fill="#fff" stroke="#1a7f37" stroke-width="3"/>
  <text x="60" y="451" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">AE1</text>
  <line x1="250" y1="445" x2="95" y2="445" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#fEvac)"/>
  <!-- AE2 / AE3: laterales de platea -->
  <circle cx="317" cy="95" r="24" fill="#fff" stroke="#1a7f37" stroke-width="3"/>
  <text x="317" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">AE2</text>
  <line x1="317" y1="168" x2="317" y2="128" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#fEvac)"/>
  <circle cx="317" cy="795" r="24" fill="#fff" stroke="#1a7f37" stroke-width="3"/>
  <text x="317" y="801" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">AE3</text>
  <line x1="317" y1="752" x2="317" y2="762" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#fEvac)"/>
  <!-- AE4: caja/hombro -->
  <circle cx="924" cy="795" r="24" fill="#fff" stroke="#1a7f37" stroke-width="3"/>
  <text x="924" y="801" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">AE4</text>
  <line x1="924" y1="770" x2="924" y2="765" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#fEvac)"/>
  <line x1="879" y1="620" x2="912" y2="757" stroke="#1a7f37" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#fEvac)"/>

  <!-- ============ LEYENDA ============ -->
  <rect x="60" y="815" width="1280" height="85" fill="#ffffff" stroke="#999"/>
  <text x="80" y="840" font-size="13" font-weight="bold" fill="#222">LEYENDA</text>
  <line x1="80" y1="862" x2="130" y2="862" stroke="#c62828" stroke-width="6" stroke-dasharray="14 8"/>
  <text x="140" y="866" font-size="12" fill="#333">Telón cortafuegos: sectoriza caja y sala. Separa el fuego del público — si el público está en la sala.</text>
  <line x1="80" y1="886" x2="130" y2="886" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#fEvac)"/>
  <text x="140" y="890" font-size="12" fill="#333">Recorrido y acceso de evacuación (AE). El público evacúa por sala y vestíbulo; la compañía, por caja y muelle.</text>
  <text x="760" y="866" font-size="12" fill="#555">Regla mnemotécnica: todo lo que está a la derecha del telón cortafuegos es "detrás";</text>
  <text x="760" y="886" font-size="12" fill="#555">el director de escenario tiene el control total de lo que ocurre en la caja durante la función.</text>
</svg>
